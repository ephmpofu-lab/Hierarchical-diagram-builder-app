<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Diagram Builder — Projects</title>
  <script>
    document.documentElement.dataset.theme = localStorage.getItem("diagram-builder-theme") || "dark";
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="topbar">
    <h1>Diagram Builder</h1>
    <div class="topbar-actions">
      <button id="themeToggleBtn" class="theme-toggle" title="Toggle light/dark theme"></button>
      <button class="btn" id="importOutlineBtn">⇩ New from outline</button>
      <button class="btn btn-primary" id="newProjectBtn">+ New project</button>
      <button class="btn btn-small icon-only" id="logoutBtn" title="Log out" onclick="logout()">⏻</button>
    </div>
  </div>

  <div class="library-wrap">
    <div id="projectGrid" class="project-grid"></div>
    <div id="emptyState" class="empty-state" style="display:none;">
      No projects yet. Click "New project" to start your first tree diagram.
    </div>
  </div>

  <div id="importModal" class="modal-backdrop" hidden>
    <div class="modal import-modal">
      <div class="modal-header-row">
        <strong>New project from outline</strong>
        <button id="importXBtn" class="theme-toggle" title="Close">×</button>
      </div>
      <p>Paste an outline to create a new project from it. Lines can use explicit <code>(Level N)</code> tags, or plain nested <code>- bullets</code> (2 spaces per level).</p>
      <textarea id="importText" rows="12" placeholder="Root item (Level 1)&#10;    Child item (Level 2)"></textarea>
      <div class="modal-actions">
        <button id="importCancelBtn" class="btn btn-small">Cancel</button>
        <button id="importConfirmBtn" class="btn btn-small btn-primary">Create project</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/library.js"></script>
</body>
</html>
